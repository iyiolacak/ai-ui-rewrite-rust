[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause",
         "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "OFL-1.1", "BSL-1.0", "0BSD", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8
# The allow list covers every crate set (runtime and Slint); not every licence appears in each.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"

[advisories]
version = 2
