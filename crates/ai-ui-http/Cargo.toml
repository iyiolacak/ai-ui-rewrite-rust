[package]
name = "ai-ui-http"
version = "0.1.0"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "HTTP clients for ai-ui-data-stream: native (ureq, rustls) and browser (fetch)."
repository.workspace = true
readme = "README.md"

[dependencies]
ai-ui-core = { path = "../ai-ui-core", version = "0.1.0" }
ai-ui-data-stream = { path = "../ai-ui-data-stream", version = "0.1.0" }
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Headers", "ReadableStream", "ReadableStreamDefaultReader", "Request", "RequestCredentials", "RequestInit", "Response", "Window"] }

[dev-dependencies]
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
serde_json = "1"
