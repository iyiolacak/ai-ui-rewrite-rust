[package]
name = "ai-ui-data-stream"
version = "0.1.0"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of @assistant-ui/react-data-stream: a ChatModelAdapter for AI SDK backends (data stream and UI message stream protocols)."
