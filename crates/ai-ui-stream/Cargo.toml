[package]
name = "ai-ui-stream"
version = "0.1.0"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of assistant-stream: chunks, the message accumulator, state operations, partial JSON and the assistant-transport serialization."
repository.workspace = true
readme = "README.md"

[dependencies]
ai-ui-core = { path = "../ai-ui-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }

[dev-dependencies]
base64 = "0.22"
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
