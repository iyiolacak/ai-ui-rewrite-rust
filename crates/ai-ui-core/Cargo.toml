[package]
name = "ai-ui-core"
version = "0.1.0"
keywords.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Rust port of @assistant-ui/core: message model, branching repository, model adapter contract and local thread runtime."
repository.workspace = true
readme = "README.md"

[dependencies]
futures-core = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
