[package]
name = "ai-ui-sdk-stream"
version = "0.1.0"
edition.workspace = true
license = "MIT AND Apache-2.0" # partial_json.rs is adapted from the AI SDK (Apache-2.0); see src/reducer/NOTICE.md
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Bounded, incremental fold of the AI SDK 7 UI message stream into messages, for native and Wasm, with a differential test against the published AI SDK."
repository.workspace = true
readme = "README.md"

[dependencies]
serde_json = "1"

[[bench]]
name = "stream_replay"
harness = false

# This crate decodes outside data, so panics and silent truncation are bugs here (the policy this crate was
# written under).
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
wildcard_enum_match_arm = "warn"
allow_attributes_without_reason = "warn"
